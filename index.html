    <div class="wrapper container-fluid py-3 px-3">

        <!-- Hero -->
        <div class="hero-section mb-4">
            <div class="hero-glow"></div>
            <h1 class="hero-title">DSA + JavaScript Learning Journey 🚀</h1>
            <p class="hero-subtitle">Learn concepts. Solve problems. Write code. Test logic. Revise faster.</p>
            <div class="hero-flow">
                <span>Learn</span><span>→</span><span>Code</span><span>→</span>
                <span>Test</span><span>→</span><span>Revise</span><span>→</span><span>Repeat</span>
            </div>
            <div class="hero-words">
                <span>Logic</span><span>Focus</span><span>Consistency</span><span>Debug</span>
                <span>Think</span><span>Practice</span><span>Grow</span><span>Mastery</span>

            <div class="chips-nav" id="chipsNav"><!-- injected by JS --></div>
            <div class="chips-actions">
                <button class="chip chip-action chip-open" id="openFileBtn" title="Load topics.json from disk">📂 Open
                    JSON</button>
                <button class="chip chip-action chip-save" id="saveFileBtn" title="Save topics to topics.json">💾 Save
                    JSON</button>
                <button class="chip chip-action chip-add" id="openFormBtn" title="Add a new topic card">＋ Add
                    Topic</button>
            </div>
        </div>

        <!-- Topics rendered here -->
        <div class="row g-4" id="topics-container"></div>

    </div>

    <!-- ── Add Topic Modal ───────────────────────────────────────────── -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Add New Topic</h3>
                <button class="modal-close" id="closeModalBtn" type="button">✕</button>
            </div>
            <form id="topicForm">
                <div class="form-group">
                    <label for="f-title">Title <span class="req">*</span></label>
                    <input id="f-title" type="text" placeholder="e.g. Two Sum Problem" required>
                </div>
                <div class="form-group">
                    <label for="f-concept">
                        Concept
                        <span class="hint">— HTML allowed: &lt;strong&gt;, &lt;br&gt;, &lt;p&gt;</span>
                    </label>
                    <textarea id="f-concept" rows="5" placeholder="Explain the concept..."></textarea>
                </div>
                <div class="form-group">
                    <label for="f-code">Code</label>
                    <textarea id="f-code" rows="9" class="mono" placeholder="// paste your code here"></textarea>
                </div>
                <div class="form-group">
                    <label for="f-output">Output / Notes</label>
                    <textarea id="f-output" rows="5" class="mono"
                        placeholder="Expected output and key takeaways..."></textarea>
                </div>
                <div class="form-footer">
                    <button type="button" id="cancelFormBtn">Cancel</button>
                    <button type="submit" class="btn-save">Save Topic</button>
                </div>
            </form>
        </div>
    </div>

            Variables differ by scope and reassignment.<br><br>
            <strong>const</strong> → default (immutable binding)<br>
            <strong>let</strong>   → use when value changes<br>
            <strong>var</strong>   → avoid (legacy)
            <p><strong>var</strong> is function-scoped; <strong>let</strong> &amp;
            <strong>const</strong> are block-scoped — safer from bugs.</p>
            <p>All three are hoisted, but <strong>let</strong> / <strong>const</strong>
            stay in the <strong>Temporal Dead Zone</strong> until declared.</p>
        `,
                code:
                    `var name  = "JS";
let count = 1;
count = 2;          // OK — let allows reassign
const pi  = 3.14;
// pi = 3;          // ❌ TypeError — const is fixed

if (true) {
  let block = "scoped";
}
// console.log(block); ❌ ReferenceError`,
                output:
                    `✔ const  — default choice
✔ let    — use in loops / counters
✔ var    — avoid (function-scope trap)

Hoisting:
  var   → undefined  (no error, but risky)
  let   → TDZ crash  if used before line
  const → TDZ crash  if used before line

Tip: prefer  const > let > var`

15

true
false

string
boolean

1

0

"99"

        `,
                code:
                    `// for loop

  console.log("i =", i);
}

// while loop

// for...of — array values
const colors = ["red", "green", "blue"];
for (const c of colors) console.log(c);

// for...in — object keys

for (const key in obj) console.log(key, ":", obj[key]);

n = 3  n = 2  n = 1

            },

            <strong>return</strong> = output.<br>

        `,
                code:
                    `// Declaration (hoisted)

console.log(multiply(3, 4)); // 12

console.log(square(5));      // 25

12
25

            <strong>sort(fn)</strong>   → sorts in-place &nbsp;&nbsp;&nbsp;&nbsp;O(n log n)<br>

                    `[0, 3, 1, 4, 1, 5, 9, 2]
[3, 1, 4, 1, 5, 9]
2
true

            },
            {
                title: "Array Methods — map, filter, find, reduce, forEach",
                concept: `
            Higher-order methods that loop and transform arrays cleanly.<br><br>
            <strong>forEach</strong>   → loop for side effects, no return value<br>
            <strong>map</strong>       → transform every item → new array<br>
            <strong>filter</strong>    → keep items that pass a test → new array<br>
            <strong>find</strong>      → first item that passes a test<br>
            <strong>findIndex</strong> → index of first match<br>
            <strong>reduce</strong>    → collapse array to a single value<br>
            <strong>some</strong>      → true if ANY item passes<br>
            <strong>every</strong>     → true if ALL items pass
            <p>None of these mutate the original array.</p>
        `,
                code:
                    `const nums = [1, 2, 3, 4, 5];

const doubled = nums.map(n => n * 2);
console.log(doubled);           // [2,4,6,8,10]

const evens = nums.filter(n => n % 2 === 0);
console.log(evens);             // [2,4]

const first = nums.find(n => n > 3);
console.log(first);             // 4

const idx = nums.findIndex(n => n > 3);
console.log(idx);               // 3

const sum = nums.reduce((acc, n) => acc + n, 0);
console.log(sum);               // 15

console.log(nums.some(n => n > 4));  // true
console.log(nums.every(n => n > 0)); // true

// Chain: squares of even numbers
const result = nums.filter(n => n%2 === 0).map(n => n*n);
console.log(result);            // [4, 16]`,

[2, 4]
4
3
15
true
true
[4, 16]

25
["name","age","lang"]

[x, y] = [y, x];

console.log(name, age);         // Bob 22

            <strong>??</strong> (Nullish) → use right side only if left is <strong>null</strong> or <strong>undefined</strong><br>
            <strong>?.</strong> (Optional chain) → safely access nested properties

        `,
                code:

console.log(user && user.name);  // "Alice"
console.log(null && "hello");    // null (short-circuits)

// || default value
const input = "";
console.log(input || "default"); // "default" ⚠ 0 also triggers

// ?? nullish coalescing
const count = 0;
console.log(count || "N/A");     // "N/A"  ⚠ 0 is falsy
console.log(count ?? "N/A");     // 0      ✔ 0 is not null/undefined

// ?. optional chaining
const data = null;
console.log(data?.name);         // undefined (no crash)`,

"Alice"
null
"default"
"N/A"
0
undefined

                concept: `
            <strong>Scope</strong> = where a variable can be accessed.<br><br>
            <strong>Global scope</strong>   → accessible everywhere<br>
            <strong>Function scope</strong> → only inside that function (var)<br>
            <strong>Block scope</strong>    → only inside { } (let, const)<br><br>
            <strong>Closure</strong> — an inner function that <em>remembers</em> variables
            from its outer function even after the outer function has finished.
            <p>Closures power: memoization, counters, module pattern —
            all common in DSA solutions.</p>
        `,
                code:
                    `// Block scope
let x = "global";
{
  let x = "block";
  console.log(x);      // "block"
}
console.log(x);        // "global"

// Closure — counter that remembers state
function makeCounter() {
  let count = 0;
  return function() { return ++count; };
}
const c = makeCounter();
console.log(c()); // 1
console.log(c()); // 2
console.log(c()); // 3

// Closure — memoization (cache results)
function memoize(fn) {
  const cache = {};
  return function(n) {
    if (n in cache) return cache[n];
    return (cache[n] = fn(n));
  };
}
const double = memoize(n => n * 2);
console.log(double(5));  // 10 — computed
console.log(double(5));  // 10 — from cache`,

global

10
10

Closure keeps "count" alive
even after makeCounter() returned.

Memoize: each input computed once,
  then O(1) on repeat calls — critical
  optimization for recursive DSA problems`

                concept: `
            <strong>Big O</strong> describes how cost scales as input size <strong>n</strong> grows.<br><br>
            <strong>O(1)</strong>       → constant &nbsp;&nbsp;&nbsp;— same time for any n<br>
            <strong>O(log n)</strong>   → logarithmic — halves the problem each step<br>
            <strong>O(n)</strong>       → linear &nbsp;&nbsp;&nbsp;&nbsp;— one pass through input<br>
            <strong>O(n log n)</strong> → efficient sort (merge sort, quick sort)<br>
            <strong>O(n²)</strong>      → quadratic &nbsp;&nbsp;— nested loops, avoid for large n<br>
            <strong>O(2ⁿ)</strong>      → exponential &nbsp;— recursion without memoization
            <p><strong>Space complexity</strong> = extra memory used by the algorithm.</p>
            <p>Goal: best balance of time and space for the given constraints.</p>

function getFirst(arr) { return arr[0]; }

// O(n) — linear scan
function linearSearch(arr, t) {
  for (let i = 0; i < arr.length; i++)
    if (arr[i] === t) return i;
  return -1;
}

// O(n²) — nested loops, slow for large n
function hasDuplicate_slow(arr) {
  for (let i = 0; i < arr.length; i++)
    for (let j = i+1; j < arr.length; j++)
      if (arr[i] === arr[j]) return true;
  return false;
}

// O(n) — same result using a Set
function hasDuplicate_fast(arr) {
  const seen = new Set();
  for (const x of arr) {
    if (seen.has(x)) return true;
    seen.add(x);
  }
  return false;
}`,

  O(n)  →  10k ops for n=10k

Always ask: "can I avoid the nested loop?"`

        // ════════════════════════════════════════════════════════════════
        //  STATE
        // ════════════════════════════════════════════════════════════════
        const LS_KEY = 'dsa_topics_v2';
        let topics = JSON.parse(localStorage.getItem(LS_KEY)) || [...DEFAULT_TOPICS];
        let activeIdx = 'all';
        let fileHandle = null;    // File System Access API handle


        // ════════════════════════════════════════════════════════════════
        //  RENDERER
        // ════════════════════════════════════════════════════════════════
        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        const DOTS = '<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

        function buildCard(t) {
            return `
    <div class="col-12">
        <div class="topic-card">
            <div class="topic-header">${t.title}</div>
            <div class="content">
                <div class="row g-3 align-items-stretch">
                    <div class="col-md-4">
                        <div class="panel h-100">
                            <div class="panel-head"><span>&#128161; Concept</span>${DOTS}</div>
                            <div class="concept-text">${t.concept}</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="panel h-100">
                            <div class="panel-head"><span>&#128196; Code</span>${DOTS}</div>
                            <div class="code">${esc(t.code)}</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="panel h-100">
                            <div class="panel-head"><span>&#128187; Output</span>${DOTS}</div>
                            <div class="terminal">${esc(t.output)}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>`;
        }

        function renderTopics() {
            const list = activeIdx === 'all' ? topics : [topics[activeIdx]];
            document.getElementById('topics-container').innerHTML = list.map(buildCard).join('');
        }

        function renderChips() {
            let html = `<button class="chip ${activeIdx === 'all' ? 'active' : ''}"
                        onclick="setFilter('all')">All Topics</button>`;
            topics.forEach((t, i) => {
                html += `<button class="chip ${activeIdx === i ? 'active' : ''}"
                         onclick="setFilter(${i})">${t.title}</button>`;
            });
            document.getElementById('chipsNav').innerHTML = html;
        }

        function setFilter(idx) {
            activeIdx = idx;
            renderChips();
            renderTopics();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            renderChips();
            renderTopics();
        }


        // ════════════════════════════════════════════════════════════════
        //  LOCAL STORAGE
        // ════════════════════════════════════════════════════════════════
        function saveLocal() {
            localStorage.setItem(LS_KEY, JSON.stringify(topics));
        }


        // ════════════════════════════════════════════════════════════════
        //  FILE SYSTEM ACCESS API  — read & write topics.json
        // ════════════════════════════════════════════════════════════════
        const FILE_OPTS = {
            types: [{ description: 'JSON file', accept: { 'application/json': ['.json'] } }],
            excludeAcceptAllOption: true
        };

        // 📂 Open — pick topics.json from disk and load it
        document.getElementById('openFileBtn').addEventListener('click', async () => {
            if (!('showOpenFilePicker' in window)) {
                toast('File System API not supported in this browser. Use Chrome or Edge.', 'warn');
                return;
            }
            try {
                [fileHandle] = await window.showOpenFilePicker({ ...FILE_OPTS, multiple: false });
                const file = await fileHandle.getFile();
                const parsed = JSON.parse(await file.text());
                if (!Array.isArray(parsed)) throw new Error('Not a valid topics JSON array');
                topics = parsed;
                activeIdx = 'all';
                saveLocal();
                render();
                toast(`Loaded ${topics.length} topics from ${file.name}`);
            } catch (e) {
                if (e.name !== 'AbortError') toast('Could not open file: ' + e.message, 'warn');
            }
        });

        // 💾 Save — write current topics back to topics.json
        document.getElementById('saveFileBtn').addEventListener('click', async () => {
            if (!('showSaveFilePicker' in window)) {
                // Fallback: trigger download
                downloadJSON();
                return;
            }
            try {
                if (!fileHandle) {
                    fileHandle = await window.showSaveFilePicker({
                        ...FILE_OPTS,
                        suggestedName: 'topics.json'
                    });
                }
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(topics, null, 2));
                await writable.close();
                toast(`Saved ${topics.length} topics to topics.json`);
            } catch (e) {
                if (e.name !== 'AbortError') toast('Save failed: ' + e.message, 'warn');
            }
        });

        function downloadJSON() {
            const blob = new Blob([JSON.stringify(topics, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'topics.json';
            a.click();
            URL.revokeObjectURL(a.href);
            toast('Downloaded topics.json');
        }


        // ════════════════════════════════════════════════════════════════
        //  FORM — add a new topic
        // ════════════════════════════════════════════════════════════════
        function openModal() { document.getElementById('formModal').classList.add('open'); }
        function closeModal() {
            document.getElementById('formModal').classList.remove('open');
            document.getElementById('topicForm').reset();
        }

        document.getElementById('openFormBtn').addEventListener('click', openModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelFormBtn').addEventListener('click', closeModal);
        document.getElementById('formModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.getElementById('topicForm').addEventListener('submit', e => {
            e.preventDefault();
            const title = document.getElementById('f-title').value.trim();
            const concept = document.getElementById('f-concept').value.trim();
            const code = document.getElementById('f-code').value.trim();
            const output = document.getElementById('f-output').value.trim();

            if (!title) return;

            topics.push({ title, concept, code, output });
            saveLocal();

            activeIdx = topics.length - 1;   // jump to the new topic
            render();
            closeModal();
            toast(`"${title}" added! Click 💾 Save JSON to persist it to file.`);
        });


        // ════════════════════════════════════════════════════════════════
        //  TOAST
        // ════════════════════════════════════════════════════════════════
        let toastTimer;
        function toast(msg, type = 'ok') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
        }


        // ════════════════════════════════════════════════════════════════
        //  INIT
        // ════════════════════════════════════════════════════════════════
        render();
    </script>
